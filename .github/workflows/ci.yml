name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typescript:
    name: TypeScript checks (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - soundproof
          - airhornbot
          - discord-aibot
          - lkeff-listen
          - lastfm-client
          - lastfm-companion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspaces
        run: npm ci

      - name: Build ${{ matrix.package }}
        run: npm run build -w ${{ matrix.package }}

      - name: Lint ${{ matrix.package }}
        run: npm run lint -w ${{ matrix.package }}

      - name: Test ${{ matrix.package }}
        run: npm run test -w ${{ matrix.package }}

      - name: Format-check ${{ matrix.package }}
        run: npm run format:check -w ${{ matrix.package }}

  python-services:
    name: Python service checks (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/mental-health
          - services/audio-events
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and compile
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall src
