name: Deploy to Fly.io

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/mental-health/**'
      - 'services/audio-events/**'
      - 'discord-aibot/**'
      - 'soundproof/**'
      - 'lkeff-listen/**'
      - 'airhornbot/**'
      - 'lastfm-client/**'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      mental_health: ${{ steps.paths.outputs.mental_health }}
      audio_events: ${{ steps.paths.outputs.audio_events }}
      discord_aibot: ${{ steps.paths.outputs.discord_aibot }}
      soundproof: ${{ steps.paths.outputs.soundproof }}
      lkeff_listen: ${{ steps.paths.outputs.lkeff_listen }}
      airhornbot: ${{ steps.paths.outputs.airhornbot }}
      lastfm_client: ${{ steps.paths.outputs.lastfm_client }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed app paths
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_paths="*"
          else
            changed_paths="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          fi

          set_output() {
            local output_name="$1"
            local path_prefix="$2"
            local changed="false"
            if [[ "$changed_paths" == "*" ]] || grep -Fq "$path_prefix/" <<< "$changed_paths"; then
              changed="true"
            fi
            printf '%s=%s\n' "$output_name" "$changed" >> "$GITHUB_OUTPUT"
          }

          set_output mental_health services/mental-health
          set_output audio_events services/audio-events
          set_output discord_aibot discord-aibot
          set_output soundproof soundproof
          set_output lkeff_listen lkeff-listen
          set_output airhornbot airhornbot
          set_output lastfm_client lastfm-client

  deploy-mental-health:
    name: Deploy mental-health service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mental_health == 'true'
    concurrency:
      group: deploy-mental-health
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy mental-health service
        run: flyctl deploy --config services/mental-health/fly.toml services/mental-health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-audio-events:
    name: Deploy audio-events service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.audio_events == 'true'
    concurrency:
      group: deploy-audio-events
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy audio-events service
        run: flyctl deploy --config services/audio-events/fly.toml services/audio-events
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-bots:
    name: Deploy ${{ matrix.app }} bot
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-mental-health, deploy-audio-events]
    if: >-
      always() &&
      needs.detect-changes.outputs[matrix.output] == 'true' &&
      (needs.deploy-mental-health.result == 'success' || needs.deploy-mental-health.result == 'skipped') &&
      (needs.deploy-audio-events.result == 'success' || needs.deploy-audio-events.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: discord-aibot
            path: discord-aibot
            output: discord_aibot
          - app: soundproof
            path: soundproof
            output: soundproof
          - app: lkeff-listen
            path: lkeff-listen
            output: lkeff_listen
          - app: airhornbot
            path: airhornbot
            output: airhornbot
          - app: lastfm-client
            path: lastfm-client
            output: lastfm_client
    concurrency:
      group: deploy-${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy ${{ matrix.app }}
        run: flyctl deploy --config ${{ matrix.path }}/fly.toml ${{ matrix.path }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
