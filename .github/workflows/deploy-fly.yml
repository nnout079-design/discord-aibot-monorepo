name: Deploy to Fly.io

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/mental-health/**'
      - 'services/audio-events/**'
      - 'discord-aibot/**'
      - 'soundproof/**'
      - 'lkeff-listen/**'
      - 'airhornbot/**'
      - 'lastfm-client/**'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

jobs:
  deploy-mental-health:
    name: Deploy mental-health service
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-mental-health
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy mental-health service
        run: flyctl deploy --config services/mental-health/fly.toml services/mental-health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-audio-events:
    name: Deploy audio-events service
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-audio-events
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy audio-events service
        run: flyctl deploy --config services/audio-events/fly.toml services/audio-events
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-bots:
    name: Deploy ${{ matrix.app }} bot
    runs-on: ubuntu-latest
    needs: [deploy-mental-health, deploy-audio-events]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: discord-aibot
            path: discord-aibot
          - app: soundproof
            path: soundproof
          - app: lkeff-listen
            path: lkeff-listen
          - app: airhornbot
            path: airhornbot
          - app: lastfm-client
            path: lastfm-client
    concurrency:
      group: deploy-${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy ${{ matrix.app }}
        run: flyctl deploy --config ${{ matrix.path }}/fly.toml ${{ matrix.path }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
