app = 'discord-mental-health-service'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = '30s'
  timeout = '10s'
  grace_period = '30s'
  method = 'GET'
  path = '/health'
  protocol = 'http'
  tls_skip_verify = false

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096

[env]
  HOST = '0.0.0.0'
  PORT = '8000'
  LOG_LEVEL = 'info'
  DEVICE = 'cpu'
  USE_ONNX = 'false'
  CRISIS_THRESHOLD = '0.5'
  EMOTION_THRESHOLD = '0.5'
  ANONYMIZE_USER_IDS = 'true'
  MAX_INPUT_LENGTH = '4000'
  MODEL_CATALOG_PATH = '/app/config/models.yaml'
  RESOURCES_PATH = '/app/config/resources.json'
