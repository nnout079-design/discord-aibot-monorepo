app = "airhornbot-bot"
primary_region = "iad"

[build]
builder = "paketobuildpacks/builder:base"

[[services]]
protocol = "tcp"
internal_port = 3000
processes = ["app"]

  [[services.ports]]
  port = 80
  handlers = ["http"]
  force_https = true

  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

[env]
NODE_ENV = "production"
PORT = "3000"
