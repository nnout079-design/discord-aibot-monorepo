app = 'lastfm-client-bot'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PROGRESS_DATA_PATH = '/app/data/progress.json'
  PORT = '8080'
  MENTAL_HEALTH_URL = 'https://discord-mental-health-service.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
